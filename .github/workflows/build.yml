name: Build Taskly APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
      FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
      FIREBASE_SENDER_ID: ${{ secrets.FIREBASE_SENDER_ID }}
      FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    steps:
      - name: Descargar el código del repo
        uses: actions/checkout@v4

      - name: Instalar Java (lo necesita Android/Gradle)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Generar android/ y aplicar configuración (widget, Firebase)
        run: |
          chmod +x .github/scripts/prepare_android.sh
          .github/scripts/prepare_android.sh

      - name: Reconstruir el keystore y key.properties
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/taskly-release.keystore
          cat > android/key.properties <<EOF
          storePassword=${KEYSTORE_PASSWORD}
          keyPassword=${KEY_PASSWORD}
          keyAlias=${KEY_ALIAS}
          storeFile=$(pwd)/android/taskly-release.keystore
          EOF
          echo "storeFile y keyAlias configurados (sin mostrar contraseñas):"
          grep -E "^(storeFile|keyAlias)=" android/key.properties
          echo "El keystore existe?"
          ls -la android/taskly-release.keystore

      - name: Reconstruir google-services.json
        run: |
          echo "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" | base64 -d > android/app/google-services.json

      - name: Instalar dependencias del proyecto
        run: flutter pub get

      - name: Generar ícono de la app y splash screen desde tus imágenes
        run: |
          dart run flutter_launcher_icons
          dart run flutter_native_splash:create

      - name: Generar archivos de idiomas (l10n)
        run: flutter gen-l10n

      - name: Compilar el APK
        run: flutter build apk --release

      - name: Subir el APK como artifact
        uses: actions/upload-artifact@v4
        with:
          name: taskly-apk
          path: build/app/outputs/flutter-apk/app-release.apk

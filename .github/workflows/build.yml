name: Build Taskly APK

# Se ejecuta cada vez que subes código a la rama "main",
# o manualmente desde GitHub Actions.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
      FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
      FIREBASE_SENDER_ID: ${{ secrets.FIREBASE_SENDER_ID }}
      FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    steps:

      # =========================================================
      # 1. Descargar código
      # =========================================================
      - name: Descargar el código del repo
        uses: actions/checkout@v4

      # =========================================================
      # 2. Java
      # =========================================================
      - name: Instalar Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # =========================================================
      # 3. Flutter
      # =========================================================
      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      # =========================================================
      # 4. Generar carpeta android/
      # =========================================================
      - name: Generar android y aplicar configuración
        run: |
          chmod +x .github/scripts/prepare_android.sh
          .github/scripts/prepare_android.sh

      # =========================================================
      # 5. Reconstruir keystore
      # =========================================================
      # El keystore se guarda en GitHub Secrets como Base64.
      # Se reconstruye aquí para firmar el APK.
      # =========================================================
      - name: Reconstruir el keystore y key.properties
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/taskly-release.keystore

          cat > android/key.properties <<EOF
          storePassword=${KEYSTORE_PASSWORD}
          keyPassword=${KEY_PASSWORD}
          keyAlias=${KEY_ALIAS}
          storeFile=../taskly-release.keystore
          EOF

      # =========================================================
      # 6. Reconstruir Firebase
      # =========================================================
      # El archivo se mantiene conceptualmente en:
      #
      # taskly/google-services.json
      #
      # y luego se copia a:
      #
      # taskly/android/app/google-services.json
      #
      # porque Gradle necesita encontrarlo ahí.
      # =========================================================
      - name: Reconstruir y validar google-services.json
        run: |
          echo "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" | base64 --decode > google-services.json

          echo "Validando google-services.json..."

          python3 -m json.tool google-services.json > /dev/null

          echo "✓ google-services.json es un JSON válido"

          mkdir -p android/app

          cp google-services.json android/app/google-services.json

          echo "✓ google-services.json copiado correctamente"

      # =========================================================
      # 7. Instalar dependencias
      # =========================================================
      - name: Instalar dependencias del proyecto
        run: |
          flutter pub get

      # =========================================================
      # 8. Generar iconos y splash
      # =========================================================
      - name: Generar ícono y splash screen
        run: |
          dart run flutter_launcher_icons
          dart run flutter_native_splash:create

      # =========================================================
      # 9. Generar idiomas
      # =========================================================
      - name: Generar archivos de idiomas
        run: |
          flutter gen-l10n

      # =========================================================
      # 10. Compilar APK
      # =========================================================
      - name: Compilar el APK
        run: |
          flutter build apk --release

      # =========================================================
      # 11. Subir APK
      # =========================================================
      - name: Subir el APK como artifact
        uses: actions/upload-artifact@v4
        with:
          name: taskly-apk
          path: build/app/outputs/flutter-apk/app-release.apk
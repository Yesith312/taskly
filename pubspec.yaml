name: taskly
description: "Taskly - organiza tus tareas de colegio y trabajo"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.19.0

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4

  # Login social
  google_sign_in: ^6.2.1

  # Notificaciones locales
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4
  flutter_timezone: ^1.0.8

  # Widget de pantalla de inicio
  home_widget: ^0.7.0

  # Estado de la app
  provider: ^6.1.2

  # Almacenamiento simple (preferencias del usuario, config de notificaciones)
  shared_preferences: ^2.3.2

  # UI
  table_calendar: ^3.1.2
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.0.10

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.1

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/
    - assets/icons/

# Genera automáticamente el ícono de la app en TODOS los tamaños que
# piden Android e iOS a partir de un solo archivo 1024x1024.
# Se corre con: flutter pub run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/app-icon.png"

# Genera la pantalla de splash nativa (la que se ve antes de que
# cargue Flutter) a partir de tus imágenes, para claro y oscuro.
# Se corre con: flutter pub run flutter_native_splash:create
flutter_native_splash:
  image: assets/images/splash-light.png
  color: "#FFFFFF"
  image_dark: assets/images/splash-dark.png
  color_dark: "#4C5FD5"
  android: true
  ios: false
  android_12:
    image: assets/images/splash-light.png
    color: "#FFFFFF"
    image_dark: assets/images/splash-dark.png
    color_dark: "#4C5FD5"
